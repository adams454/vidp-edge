global: { scrape_interval: 5s }
scrape_configs:
  - job_name: ingest
    scheme: https
    tls_config: { insecure_skip_verify: true }   # réseau Docker interne ; certificat lié à l'IP publique
    static_configs: [{ targets: ["ingest:8443"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9200"] }]
  - job_name: public
    static_configs: [{ targets: ["public:8080"] }]
  - job_name: node
    static_configs: [{ targets: ["host.docker.internal:9100"] }]
