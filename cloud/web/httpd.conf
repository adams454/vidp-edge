# Apache2 — « Video Viewer Page » : sert la page statique et relaie /api, /media vers l'API publique
# (lecture seule). Aucune autre route n'est exposée.
ServerRoot "/usr/local/apache2"
Listen 80
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

User daemon
Group daemon
ServerName vidp
ServerTokens Prod
ServerSignature Off
TraceEnable Off

DocumentRoot "/usr/local/apache2/htdocs"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "/usr/local/apache2/htdocs">
    Options None
    AllowOverride None
    Require all granted
</Directory>
DirectoryIndex index.html
TypesConfig conf/mime.types
AddType text/vtt .vtt

ProxyRequests Off
ProxyPass        /api/    http://public:8080/api/
ProxyPassReverse /api/    http://public:8080/api/
ProxyPass        /media/  http://public:8080/media/
ProxyPassReverse /media/  http://public:8080/media/
ProxyPass        /healthz http://public:8080/healthz

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; media-src 'self'; img-src 'self' data:"

ErrorLog /proc/self/fd/2
LogFormat "%h %t \"%r\" %>s %b %D" timing
CustomLog /proc/self/fd/1 timing
