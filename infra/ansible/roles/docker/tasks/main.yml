---
- name: Prérequis
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, python3, tar, iproute2]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Clé et dépôt Docker
  ansible.builtin.shell: |
    set -e
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable" > /etc/apt/sources.list.d/docker.list
  args: { creates: /etc/apt/sources.list.d/docker.list }

- name: Docker Engine + plugin compose
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true

- name: Docker actif
  ansible.builtin.service: { name: docker, state: started, enabled: true }
