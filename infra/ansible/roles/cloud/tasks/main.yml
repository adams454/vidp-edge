---
- name: Répertoires
  ansible.builtin.file: { path: "{{ item }}", state: directory, mode: "0755" }
  loop: [/opt/vidp, /opt/vidp/cloud/certs]

- name: Déployer le dépôt
  ansible.builtin.unarchive: { src: /tmp/vidp-bundle.tgz, dest: /opt/vidp }

- name: Données (propriétaire = utilisateur non-root des conteneurs)
  ansible.builtin.file: { path: /opt/vidp/cloud/data, state: directory, owner: "10001", group: "10001", mode: "0750" }

- name: Certificat et clé TLS
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/opt/vidp/cloud/certs/{{ item.name }}"
    owner: "10001"
    mode: "{{ item.mode }}"
  loop:
    - { name: cert.pem, content: "{{ tls_cert_pem }}", mode: "0644" }
    - { name: key.pem, content: "{{ tls_key_pem }}", mode: "0400" }
  no_log: true

- name: Secrets et configuration d'exécution (hors image, 0600)
  ansible.builtin.template: { src: env.j2, dest: /opt/vidp/cloud/.env, mode: "0600" }
  no_log: true

- name: Construire l'image (ou la récupérer si un registre est fourni)
  ansible.builtin.command: "{{ 'docker compose pull ingest' if vidp_registry is defined else 'docker compose build ingest' }}"
  args: { chdir: /opt/vidp/cloud }
  changed_when: true

- name: Démarrer la pile Cloud
  ansible.builtin.command: >-
    docker compose {{ '' if cloud_colocated | default(false) | bool else '--profile standalone' }}
    up -d --no-build --remove-orphans
  args: { chdir: /opt/vidp/cloud }
  changed_when: true

- name: Pare-feu — ingestion et Prometheus réservés aux nœuds Edge (chaîne DOCKER-USER)
  ansible.builtin.shell: |
    set -e
    iptables -N VIDP 2>/dev/null || iptables -F VIDP
    for p in 8443 {{ cloud_prom_port | default(9090) }}; do
      for c in {{ edge_cidrs.split(',') | join(' ') }}; do
        iptables -A VIDP -p tcp -m conntrack --ctorigdstport $p -s $c -j RETURN
      done
      iptables -A VIDP -p tcp -m conntrack --ctorigdstport $p -s 127.0.0.0/8 -j RETURN
      iptables -A VIDP -p tcp -m conntrack --ctorigdstport $p -j DROP
    done
    iptables -C DOCKER-USER -j VIDP 2>/dev/null || iptables -I DOCKER-USER -j VIDP
  when:
    - cloud_firewall | default(1) | int == 1
    - not (cloud_colocated | default(false) | bool)
    - edge_cidrs | default('') | length > 0
    - (storage | default('local')) != 'aws'      # sur AWS, c'est le groupe de sécurité qui filtre
  changed_when: true

- name: Attendre la page publique (Apache2 -> API publique)
  ansible.builtin.uri: { url: "http://127.0.0.1/healthz", status_code: 200 }
  register: r
  until: r.status == 200
  retries: 40
  delay: 3

- name: Attendre l'API d'ingestion (TLS)
  ansible.builtin.uri: { url: "https://127.0.0.1:8443/healthz", validate_certs: false, status_code: 200 }
  register: r2
  until: r2.status == 200
  retries: 40
  delay: 3
